<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventrox — Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="nav">
  <div class="nav__brand">VENTROX</div>
  <nav class="nav__links">
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="about.html">About</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<main>
  <section class="page-hero">
    <p class="page-hero__eyebrow">Contact</p>
    <h1>Let's talk.</h1>
  </section>

  <section class="contact-page">
    <div class="contact-page__info">
      <p>Have a project, an opportunity, or just want to connect? Send a message and I'll get back to you.</p>
      <p>Email: <a href="mailto:you@example.com">you@example.com</a></p>
      <p>GitHub: <a href="https://github.com/">github.com/yourusername</a></p>
    </div>

    <form id="contact-form" class="contact__form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit" class="btn btn--wide">Send message</button>
      <p id="form-status" class="form-status" role="status"></p>
    </form>
  </section>
</main>

<footer class="footer">
  <span>© 2026 Ventrox</span>
  <span>Built quiet, shipped loud.</span>
</footer>

<script src="js/script.js"></script>
</body>
</html>
